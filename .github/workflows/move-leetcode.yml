name: Move LeetCode Solutions

on:
  push:
    paths:
      - '[0-9][0-9][0-9][0-9]-*/**'

  workflow_dispatch:

concurrency:
  group: move-leetcode-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  move-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 3
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Move LeetCode solutions
        run: |
          set -e

          TARGET_DIR="js/LeetCode"

          mkdir -p "$TARGET_DIR"

          found=0

          for d in [0-9][0-9][0-9][0-9]-*; do
            if [ -d "$d" ]; then
              echo "Moving: $d -> $TARGET_DIR/"
              mv "$d" "$TARGET_DIR/"
              found=1
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "No LeetCode directories found."
            exit 0
          fi

      - name: Squash LeetHub commits
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          echo "=== Current changes ==="
          git status --short

          # 현재 커밋 메시지 저장
          COMMIT_MESSAGE="$(git log -1 --pretty=%B)"

          echo "=== Current commit ==="
          git log -2 --oneline

          # 직전 2개의 커밋을 하나로 합침
          git reset --soft HEAD~2

          # 현재 작업 내용 + 두 커밋의 내용을 하나의 커밋으로 생성
          git commit -m "$COMMIT_MESSAGE"

          echo "=== Final commit ==="
          git log -1 --oneline

          echo "=== Push ==="
          git push --force origin HEAD:${GITHUB_REF_NAME}
