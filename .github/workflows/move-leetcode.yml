name: Move LeetCode Solutions

on:
  workflow_dispatch:
  push:
    paths:
      - '[0-9][0-9][0-9][0-9]-*/**'

# 같은 브랜치에서 동시에 실행되지 않도록 설정
concurrency:
  group: move-leetcode-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  move-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Move LeetCode solutions
        run: |
          set -e

          TARGET_DIR="js/LeetCode"

          mkdir -p "$TARGET_DIR"

          found=0

          for d in [0-9][0-9][0-9][0-9]-*; do
            if [ -d "$d" ]; then
              echo "Moving: $d -> $TARGET_DIR/"
              mv "$d" "$TARGET_DIR/"
              found=1
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "No LeetCode directories found."
            exit 0
          fi

      - name: Amend previous commit
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          echo "=== Current changes ==="
          git status --short

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          echo "=== Amend previous commit ==="
          git commit --amend --no-edit

          echo "=== Amended commit ==="
          git log -1 --oneline

          echo "=== Push ==="
          git push --force origin HEAD:${GITHUB_REF_NAME}
